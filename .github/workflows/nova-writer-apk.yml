name: Build NovaWriter APK
on:
  push:
    branches:
      - sandbox/nova-writer-apk
  workflow_dispatch:
  pull_request:
    branches: [ main ]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p NovaWriter :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NovaWriter-debug-apk
          path: NovaWriter/app/build/outputs/apk/debug/app-debug.apk
