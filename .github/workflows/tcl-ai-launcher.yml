name: Build TCL AI Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [tcl-ai-launcher-build]
    paths:
      - 'tcl-ai-launcher/**'
      - '.github/workflows/tcl-ai-launcher.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: tcl-ai-launcher/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TCL-AI-Launcher-debug-apk
          path: tcl-ai-launcher/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
