name: Build Nova Mobile 0.9 Glass preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  glass-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract sanitized Claude Glass project
        run: |
          rm -rf app
          tar -xJf scripts/nova09_glass_source.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test Glass preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaMobile-0.9-Glass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
