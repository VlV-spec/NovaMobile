name: Build Nova Mobile 1.1 Glass preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  glass-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract sanitized Claude Glass project
        run: |
          rm -rf app
          tar -xJf scripts/nova09_glass_source.tar.xz
      - name: Apply sanitized Nova 1.0 Glass changes
        run: |
          cat scripts/nova10_patch_*.b64 | base64 -d > /tmp/nova10.diff.xz
          echo "54631f4cefa3d490892121ebf4afc84f0f6d295880e270c21e6593820794d441  /tmp/nova10.diff.xz" | sha256sum -c -
          xz -dc /tmp/nova10.diff.xz | sed -n '/^--- a\/app\/build.gradle.kts/,$p' | patch --batch -p1
          test ! -e app/nova.keystore
          grep -q 'com.novahome.mobile.glass10preview' app/build.gradle.kts

      - name: Apply sanitized Nova 1.1 Glass redesign
        run: |
          cat scripts/nova11_b64_*.txt | base64 -d > /tmp/nova11.diff.xz
          echo "710b5f2a43c24963f68989d0f2c6513fa294cb2b4b023d907709a8ad8d552d88  /tmp/nova11.diff.xz" | sha256sum -c -
          xz -dc /tmp/nova11.diff.xz | patch --batch -p1
          test ! -e app/nova.keystore
          grep -q 'com.novahome.mobile.glass11preview' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test Glass preview
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaMobile-1.1-Glass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
