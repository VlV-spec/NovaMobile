name: Build Nova Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o NovaMobile_0.1_GitHub.zip

      - name: Apply Nova Mobile 0.5 customizations
        run: python3 scripts/upgrade_05.py

      - name: Apply Nova Mobile 0.6 gestures
        run: python3 scripts/upgrade_06.py

      - name: Fix Dock pinning and persistence in Nova 0.6.1
        run: python3 scripts/upgrade_061.py

      - name: Add explicit Dock slot picker in Nova 0.6.2
        run: python3 scripts/upgrade_062.py

      - name: Rebuild Dock model and run regression tests in Nova 0.6.3
        run: python3 -c 'import gzip; exec(gzip.open("scripts/upgrade_063.py.gz", "rt", encoding="utf-8").read())'

      - name: Add lightweight native widgets in Nova 0.7
        run: python3 -c 'import gzip; exec(gzip.open("scripts/upgrade_070.py.gz", "rt", encoding="utf-8").read())'

      - name: Open alarms and calendar by tapping widgets in Nova 0.7.1
        run: python3 -c 'import gzip; exec(gzip.open("scripts/upgrade_071.py.gz", "rt", encoding="utf-8").read())'

      - name: Remove duplicate battery and clock date in Nova 0.7.2
        run: python3 scripts/upgrade_072.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
