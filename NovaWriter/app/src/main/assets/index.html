<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="description" content="Nova Writer — офлайн-редактор документов DOCX" />
<title>Nova Writer — документы</title>
<style>
:root{--blue:#185abd;--blue-deep:#104596;--ink:#25282c;--muted:#68727f;--line:#e3e7ed;--panel:#fff;--page:#fff;--back:#f0f2f5;--tint:#e8f0ff;--shadow:0 3px 16px rgba(25,42,65,.10);--app-height:100dvh}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--back)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}input{min-width:0}.hidden{display:none!important}
#app{height:var(--app-height);display:flex;flex-direction:column;overflow:hidden}#home{height:100%;display:flex;flex-direction:column;background:#fafbfc}#workspace{height:100%;display:flex;flex-direction:column}
.home-hero{color:#fff;background:linear-gradient(126deg,#0d438f,#2368c8);padding:calc(26px + env(safe-area-inset-top, 0px)) 20px 28px;box-shadow:0 2px 12px #244d822b}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;background:#fff;border-radius:11px;box-shadow:5px 5px 0 #82b3ff55;display:grid;place-items:center;color:var(--blue);font-weight:900;font-size:25px;letter-spacing:-2px}.brand strong{font-size:21px;letter-spacing:-.5px}.brand small{display:block;opacity:.82;margin-top:3px;font-size:12px}.home-hero h1{font-size:26px;font-weight:650;margin:35px 0 6px;letter-spacing:-.6px}.home-hero p{font-size:13px;opacity:.86;margin:0;line-height:1.5}.home-actions{display:flex;gap:10px;margin-top:24px}.primary,.secondary{border:0;border-radius:9px;min-height:44px;padding:0 17px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:9px}.primary{background:#fff;color:#1552a5}.secondary{background:#ffffff24;border:1px solid #ffffff4b;color:#fff}.mini-icon{width:18px;height:18px;fill:currentColor}.home-content{padding:20px;overflow:auto;flex:1}.section-title{font-weight:700;margin:3px 0 14px;font-size:16px}.recent-list{display:flex;flex-direction:column;gap:9px}.recent{border:1px solid #e6e9ef;box-shadow:0 2px 7px #1a273908;background:white;border-radius:12px;display:flex;align-items:center;gap:13px;padding:13px;text-align:left;width:100%}.recent:hover{border-color:#a9c3ea}.file-icon{background:var(--tint);border-radius:9px;color:var(--blue);font-weight:850;padding:13px 12px;font-size:18px}.recent-text{min-width:0;flex:1}.recent strong{display:block;font-size:14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.recent span{font-size:12px;color:var(--muted);margin-top:4px;display:block}.empty{border:1px dashed #ccd5e4;background:white;border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);line-height:1.5}.empty div{font-size:28px;margin-bottom:7px}
.top{background:var(--blue);color:white;min-height:59px;display:flex;align-items:center;padding:6px 10px;gap:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));box-shadow:0 1px 8px #00387d22;z-index:20}.top button{border:0;background:transparent;color:white;border-radius:8px;display:grid;place-items:center;min-height:37px;min-width:36px}.top button:hover{background:#ffffff1a}.top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.doc-heading{flex:1;display:flex;flex-direction:column;min-width:0;align-items:flex-start;gap:1px}.doc-name{border:0;background:transparent;color:white;font-size:15px;font-weight:650;width:100%;padding:1px 0;text-overflow:ellipsis}.doc-name:focus{outline:none;border-bottom:1px solid white}.save-status{font-size:10px;opacity:.76;min-height:11px}.top-actions{display:flex;gap:0}.top .save-button{background:#fff;color:var(--blue);font-weight:700;font-size:12px;display:flex;gap:5px;padding:0 12px;min-width:73px;border-radius:8px}.save-button svg{width:17px;height:17px}
.tab-strip{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 7px;min-height:42px;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex-shrink:0}.tab-strip::-webkit-scrollbar{display:none}.tab{background:transparent;border:0;color:#68717b;padding:0 14px;font-size:13px;font-weight:550;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.ribbon{height:90px;flex-shrink:0;display:flex;gap:2px;background:#fff;border-bottom:1px solid #d9e0e8;align-items:stretch;overflow-x:auto;padding:9px 10px 7px;scrollbar-width:thin;box-shadow:0 1px 3px #192f4c0d}.tools{display:flex;align-items:center;gap:5px;flex-shrink:0}.tool{height:37px;min-width:36px;padding:0 9px;border:1px solid transparent;background:white;border-radius:6px;color:#263340;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tool:hover{background:#eef3fb}.tool.active{background:#e7f0ff;color:var(--blue);border-color:#a7c8ff}.tool .glyph{font-size:17px;font-family:Georgia,serif;line-height:22px}.tool small{font:10px Roboto,Arial,sans-serif;color:#78828f}.tool b{font-size:17px}.tool em{font:bold italic 17px Georgia,serif}.tool.underline .glyph{text-decoration:underline}.tool.strike .glyph{text-decoration:line-through}.divider-vert{height:44px;width:1px;background:var(--line);margin:0 5px;flex-shrink:0}.group{display:flex;align-items:center;gap:5px;flex-shrink:0}.control{height:35px;border:1px solid #dee4ed;background:white;border-radius:6px;color:#364253;padding:0 8px;font-size:12px;max-width:136px}.color-btn .underline-color{height:3px;width:22px;background:#d64242;display:block;margin-top:2px}.ribbon-label{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:45px;text-align:center}.ribbon-label span{font-size:10px;color:#778396}
.tool-chip{background:#fff;border:1px solid #e1e6ee;border-radius:6px;padding:8px 12px;font-size:12px;min-width:fit-content}.tool-chip:hover{background:#edf4ff}.tool-chip.primary-chip{color:var(--blue);border-color:#b5d0ff}
.editor-area{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:25px 18px 40px;background:var(--back)}.page{width:min(100%,800px);min-height:780px;margin:0 auto;background:var(--page);box-shadow:var(--shadow);border:1px solid #e3e8f0}.page-inner{margin:0 auto;padding:66px 69px;min-height:780px;outline:0;line-height:1.52;font-family:Calibri,'Carlito',Arial,sans-serif;font-size:16px;color:#202329;word-wrap:break-word;white-space:normal}.page-inner:focus{outline:0}.page-inner p{margin:0 0 12px}.page-inner h1{font-size:27px;color:#224f92;font-weight:500;margin:8px 0 16px;line-height:1.22}.page-inner h2{font-size:22px;color:#224f92;font-weight:500;margin:11px 0 14px}.page-inner h3{font-size:18px;color:#224f92;margin:10px 0 11px}.page-inner ul,.page-inner ol{margin:10px 0 12px;padding-left:24px}.page-inner li{margin:0 0 4px}.page-inner table{border-collapse:collapse;min-width:80%;margin:14px 0;max-width:100%}.page-inner td{border:1px solid #9ca8b7;padding:7px 9px;min-width:60px;vertical-align:top}.page-inner img{max-width:100%;height:auto}.page-inner blockquote{border-left:3px solid #b3c9e7;padding:9px 14px;margin:10px 0;background:#f9fbfe}.page-inner a{color:#1a5ec1}.page-inner [contenteditable="false"]{cursor:default}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:31px;background:#fff;border-top:1px solid var(--line);padding:0 14px;color:#7a8695;font-size:11px;flex-shrink:0}.status-actions{display:flex;gap:11px}.status-actions button{border:0;background:transparent;color:var(--blue);font-size:11px;padding:5px 2px}
#toast{position:fixed;z-index:1000;bottom:55px;left:50%;transform:translateX(-50%) translateY(10px);background:#263648;color:white;font-size:13px;line-height:1.4;border-radius:10px;padding:11px 16px;box-shadow:0 8px 35px #0004;opacity:0;pointer-events:none;transition:all .2s;max-width:90%;min-width:180px;text-align:center}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menu-shade{position:fixed;inset:0;background:#07152d79;z-index:49;display:flex;align-items:flex-end;justify-content:center}.menu-sheet{width:min(100%,520px);padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px #050d2044}.menu-sheet h3{margin:0 0 15px;font-size:16px}.menu-item{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:0;padding:14px 6px;text-align:left;font-size:14px;border-bottom:1px solid #f0f1f3}.menu-item .symbol{font-size:19px;min-width:24px;text-align:center;color:var(--blue)}.menu-close{margin-top:8px;background:#f0f3f8;border-radius:9px;width:100%;border:0;padding:12px;font-weight:600;color:#35445b}
@media(max-width:620px){.ribbon{height:72px;padding:5px 7px}.tool small,.ribbon-label{display:none}.divider-vert{height:30px;margin:0 3px}.page-inner{padding:38px 28px;min-height:650px;font-size:15px}.page{min-height:650px}.editor-area{padding:12px 8px 24px}.tool{min-width:35px;height:36px}.control{max-width:115px}.top .save-button{min-width:59px;padding:0 8px}.tab{padding:0 12px}}
@media(min-width:900px){.top{padding-left:22px;padding-right:22px}.home-hero{padding-left:max(28px,calc((100vw - 940px)/2));padding-right:max(28px,calc((100vw - 940px)/2))}.home-content{padding-left:max(28px,calc((100vw - 940px)/2));padding-right:max(28px,calc((100vw - 940px)/2))}.page{width:794px}.page-inner{padding:82px 88px;min-height:1040px}.tab-strip{padding-left:18px}.ribbon{padding-left:18px}}
@media print{#home,.top,.tab-strip,.ribbon,.statusbar,#toast,.menu-shade{display:none!important}#app,#workspace,.editor-area{height:auto;display:block;overflow:visible;background:#fff;padding:0}.page{box-shadow:none;border:0;width:100%;min-height:0}.page-inner{padding:0;min-height:0}}
</style>
</head>
<body>
<div id="app">
<section id="home">
  <div class="home-hero">
    <div class="brand"><div class="logo">N</div><div><strong>Nova Writer</strong><small>Документы — просто и без облака</small></div></div>
    <h1>Твои документы.</h1><p>Создавай и редактируй файлы DOCX без интернета, аккаунта и подписки.</p>
    <div class="home-actions"><button id="newDoc" class="primary"><span>＋</span> Новый документ</button><button id="openDoc" class="secondary"><span>▤</span> Открыть DOCX</button></div>
  </div>
  <div class="home-content"><div class="section-title">Недавние документы</div><div id="recentList" class="recent-list"></div></div>
</section>
<section id="workspace" class="hidden">
  <header class="top">
    <button id="goHome" aria-label="На главную" title="На главную"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="doc-heading"><input class="doc-name" id="docName" aria-label="Имя документа" value="Документ" maxlength="100" spellcheck="false"/><div class="save-status" id="saveStatus">Сохранено локально</div></div>
    <div class="top-actions">
      <button title="Отменить" data-command="undo" aria-label="Отменить"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/></svg></button>
      <button title="Повторить" data-command="redo" aria-label="Повторить"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v3"/></svg></button>
      <button title="Сохранить DOCX" id="quickSave" class="save-button"><svg viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3h2Z"/><path d="M7 3v6h10V3M7 21v-9h10v9"/></svg>DOCX</button>
      <button id="showMenu" title="Файл и настройки" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M12 5v.01M12 12v.01M12 19v.01" stroke-width="4"/></svg></button>
    </div>
  </header>
  <nav class="tab-strip" aria-label="Инструменты"><button data-tab="home" class="tab active">Главная</button><button data-tab="insert" class="tab">Вставка</button><button data-tab="layout" class="tab">Макет</button><button data-tab="review" class="tab">Рецензирование</button><button data-tab="view" class="tab">Вид</button></nav>
  <div id="ribbon" class="ribbon" aria-label="Лента инструментов"></div>
  <main class="editor-area" id="scrollArea"><article class="page"><div id="editor" class="page-inner" contenteditable="true" spellcheck="true" aria-label="Текст документа"><h1>Новый документ</h1><p>Нажми сюда и начни печатать...</p></div></article></main>
  <footer class="statusbar"><span id="stats">0 слов · 0 символов</span><div class="status-actions"><span id="offlineText">● Офлайн</span><button id="printBtn">Печать</button></div></footer>
</section>
</div>
<div id="toast"></div>
<div id="menu" class="menu-shade hidden"><div class="menu-sheet"><h3>Файл</h3><button class="menu-item" id="menuNew"><span class="symbol">＋</span>Новый документ</button><button class="menu-item" id="menuOpen"><span class="symbol">▤</span>Открыть DOCX</button><button class="menu-item" id="menuSave"><span class="symbol">▣</span>Сохранить как DOCX</button><button class="menu-item" id="menuHtml"><span class="symbol">⌘</span>Экспорт в HTML</button><button class="menu-item" id="menuText"><span class="symbol">☷</span>Экспорт в TXT</button><button class="menu-item" id="menuPrint"><span class="symbol">▧</span>Печать / PDF</button><button class="menu-close" id="closeMenu">Закрыть</button></div></div>
<input type="file" id="fileInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden />
<script>
'use strict';
/* Nova Writer — standalone, zero-dependency, offline DOCX editor.
   All JavaScript, markup and OOXML generation in this project is original. */
const $ = id => document.getElementById(id);
const editor = $('editor');
const state = {id: null, name: 'Документ', dirty: false, savedSelection: null, tab: 'home', saveTimer: null, currentUri: null};
const STORAGE = 'nova-writer-docs-v1';
const encoder = new TextEncoder();
const decoder = new TextDecoder('utf-8');
const isAndroid = !!(window.AndroidBridge && typeof window.AndroidBridge.saveDocument === 'function');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeXml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function safeName(s){return (s||'Документ').replace(/[\\/:*?"<>|\x00-\x1F]/g,'_').trim().replace(/\.docx$/i,'').slice(0,80)||'Документ';}
function uuid(){return 'd'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2900);}
function getDocs(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function saveDocs(docs){localStorage.setItem(STORAGE,JSON.stringify(docs));}
function renderRecent(){const docs=Object.values(getDocs()).sort((a,b)=>(b.updated||0)-(a.updated||0));const box=$('recentList');box.replaceChildren();if(!docs.length){box.innerHTML='<div class="empty"><div>▤</div>Тут появятся твои документы.<br>Создай первый — он сохранится на устройстве.</div>';return;}docs.forEach(d=>{const btn=document.createElement('button');btn.className='recent';btn.innerHTML='<span class="file-icon">N</span><span class="recent-text"><strong>'+escapeHtml(d.name||'Документ')+'</strong><span>'+new Date(d.updated||Date.now()).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' · На устройстве</span></span><span style="color:#98a6b7">›</span>';btn.onclick=()=>openLocal(d.id);box.appendChild(btn);});}
function showHome(){flushDraft();$('home').classList.remove('hidden');$('workspace').classList.add('hidden');renderRecent();}
function showWorkspace(){ $('home').classList.add('hidden');$('workspace').classList.remove('hidden');$('docName').value=state.name; updateStats();renderRibbon(); }
function createNew(){state.id=uuid();state.name='Документ';state.currentUri=null;state.dirty=true;editor.innerHTML='<p><br></p>';showWorkspace();flushDraft();editor.focus();toast('Новый документ создан');}
function openLocal(id){const d=getDocs()[id];if(!d){toast('Черновик не найден');return;}state.id=id;state.name=d.name||'Документ';state.currentUri=null;state.dirty=false;editor.innerHTML=d.html||'<p><br></p>';showWorkspace();$('saveStatus').textContent='Черновик на устройстве';}
function flushDraft(){if(!state.id)return;clearTimeout(state.saveTimer);const docs=getDocs();docs[state.id]={id:state.id,name:safeName($('docName').value||state.name),html:editor.innerHTML,updated:Date.now()};try{saveDocs(docs);state.dirty=false;$('saveStatus').textContent='Черновик сохранён локально';}catch(e){$('saveStatus').textContent='Нет места для черновика';toast('Нет места в хранилище. Экспортируй DOCX.');}}
function markDirty(){state.dirty=true;$('saveStatus').textContent='Сохранение черновика…';updateStats();clearTimeout(state.saveTimer);state.saveTimer=setTimeout(flushDraft,700);}
function updateStats(){let t=editor.innerText||'';let words=t.trim().match(/[^\s]+/g);$('stats').textContent=(words?words.length:0)+' слов · '+t.length+' символов';}
function saveSelection(){const sel=window.getSelection();if(sel && sel.rangeCount && editor.contains(sel.anchorNode)){state.savedSelection=sel.getRangeAt(0).cloneRange();}}
function restoreSelection(){if(!state.savedSelection)return;try{const sel=window.getSelection();sel.removeAllRanges();sel.addRange(state.savedSelection);}catch{}}
function focusEditor(){editor.focus({preventScroll:true});restoreSelection();}
function command(cmd,arg=null){focusEditor();document.execCommand(cmd,false,arg);saveSelection();markDirty();}
function block(tag){focusEditor();document.execCommand('formatBlock',false,tag);saveSelection();markDirty();}
function insertTable(){focusEditor();let html='<table><tbody>';for(let r=0;r<3;r++){html+='<tr>';for(let c=0;c<3;c++)html+='<td><br></td>';html+='</tr>';}html+='</tbody></table><p><br></p>';document.execCommand('insertHTML',false,html);markDirty();}
function insertLink(){const url=prompt('Адрес ссылки (https://…)');if(!url)return;try{const obj=new URL(url);if(!['https:','http:'].includes(obj.protocol))throw Error('invalid');command('createLink',obj.href);}catch{toast('Нужен адрес http:// или https://');}}
function setIndent(decrease){command(decrease?'outdent':'indent');}
const tabs={
 home:`<div class="group"><select class="control" id="styleSelect" aria-label="Стиль абзаца"><option value="p">Обычный текст</option><option value="h1">Заголовок 1</option><option value="h2">Заголовок 2</option><option value="h3">Заголовок 3</option></select><select class="control" id="fontSelect" aria-label="Шрифт"><option value="Calibri">Calibri</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option></select><select class="control" id="sizeSelect" aria-label="Размер шрифта"><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option></select></div><div class="divider-vert"></div><div class="tools"><button class="tool" data-command="bold" aria-label="Полужирный"><b>Ж</b></button><button class="tool" data-command="italic" aria-label="Курсив"><em>К</em></button><button class="tool underline" data-command="underline" aria-label="Подчёркивание"><span class="glyph">Ч</span></button><button class="tool strike" data-command="strikeThrough" aria-label="Зачёркивание"><span class="glyph">З</span></button></div><div class="divider-vert"></div><div class="tools"><button class="tool color-btn" id="textColor" title="Цвет шрифта"><span class="glyph">A</span><span class="underline-color"></span></button><button class="tool" id="highlight" title="Выделить цветом"><span class="glyph" style="background:#fff1a8;padding:0 4px">✎</span></button><button class="tool" data-command="removeFormat" title="Убрать форматирование"><span class="glyph">⌫</span></button></div><div class="divider-vert"></div><div class="tools"><button class="tool" data-command="insertUnorderedList" title="Маркеры"><span class="glyph">☷</span></button><button class="tool" data-command="insertOrderedList" title="Нумерация"><span class="glyph">☰</span></button><button class="tool" data-command="justifyLeft" title="По левому краю"><span class="glyph">≡</span></button><button class="tool" data-command="justifyCenter" title="По центру"><span class="glyph">☰</span></button><button class="tool" data-command="justifyRight" title="По правому краю"><span class="glyph">≡</span></button></div>`,
 insert:`<div class="tools"><button class="tool-chip primary-chip" data-action="table">▦ Таблица 3×3</button><button class="tool-chip" data-action="image">▧ Рисунок</button><button class="tool-chip" data-action="link">🔗 Ссылка</button><button class="tool-chip" data-action="horizontal">— Линия</button><button class="tool-chip" data-action="date">◷ Дата</button></div>`,

const numbering='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/></w:lvl></w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="singleLevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/></w:lvl></w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num><w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num></w:numbering>';
const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'+ctx.rels.join('')+'</Relationships>';
const types='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Default Extension="webp" ContentType="image/webp"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>';
const core='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+escapeXml(title||'Документ')+'</dc:title><dc:creator>Nova Writer</dc:creator></cp:coreProperties>';
const entries={'[Content_Types].xml':types,'_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>','docProps/core.xml':core,'word/document.xml':documentXml,'word/styles.xml':styles,'word/numbering.xml':numbering,'word/_rels/document.xml.rels':rels,...ctx.media};return zipStore(entries);}
// Events
$('newDoc').onclick=createNew;$('openDoc').onclick=openFilePicker;$('goHome').onclick=showHome;
$('docName').addEventListener('input',e=>{state.name=safeName(e.target.value);markDirty();});$('docName').addEventListener('blur',e=>{e.target.value=safeName(e.target.value);});
$('quickSave').onclick=exportDocx;$('showMenu').onclick=()=>toggleMenu(true);$('closeMenu').onclick=()=>toggleMenu(false);$('menu').addEventListener('click',e=>{if(e.target.id==='menu')toggleMenu(false);});
$('menuNew').onclick=()=>{toggleMenu(false);flushDraft();createNew();};$('menuOpen').onclick=openFilePicker;$('menuSave').onclick=()=>{toggleMenu(false);exportDocx();};$('menuHtml').onclick=()=>{toggleMenu(false);exportOther('html');};$('menuText').onclick=()=>{toggleMenu(false);exportOther('txt');};$('menuPrint').onclick=printDoc;$('printBtn').onclick=printDoc;
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{saveSelection();state.tab=t.dataset.tab;renderRibbon();}));
$('ribbon').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;saveSelection();if(b.dataset.command)command(b.dataset.command);else if(b.dataset.action)handleAction(b.dataset.action);else if(b.id==='textColor'){const v=prompt('Цвет текста в HEX, например #185ABD','#185ABD');if(v&&/^#[0-9a-f]{6}$/i.test(v))command('foreColor',v);}else if(b.id==='highlight'){command('hiliteColor','#fff3a0');}});
document.querySelector('.top-actions').addEventListener('click',e=>{const b=e.target.closest('button[data-command]');if(b)command(b.dataset.command);});
editor.addEventListener('input',markDirty);editor.addEventListener('keyup',saveSelection);editor.addEventListener('mouseup',saveSelection);editor.addEventListener('touchend',saveSelection);
editor.addEventListener('paste',e=>{e.preventDefault();const t=e.clipboardData?.getData('text/plain')||'';document.execCommand('insertText',false,t);markDirty();});
$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>25*1024*1024){toast('DOCX не должен превышать 25 МБ');return;}await loadDocx(await file.arrayBuffer(),file.name);});
$('imageInput').addEventListener('change',e=>{const file=e.target.files?.[0];e.target.value='';imageChosen(file);});
window.addEventListener('beforeunload',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraft();});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportDocx();}});
renderRecent();

</script>
